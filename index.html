<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal &amp; Privacy — Instagram Public Media Downloader</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 2.5rem 1.25rem;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    .links { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    a.btn {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      background: var(--accent);
      color: #0d1117;
    }
    a.btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Legal Documentation</h1>
    <p>Official Privacy Policy and Terms of Service for our public Instagram content download service.</p>
    <div class="links">
      <a class="btn" href="./privacy.html">Privacy Policy</a>
      <a class="btn secondary" href="./terms.html">Terms of Service</a>
    </div>
  </main>
</body>
</html>
